<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Upload Logo Bank</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .upload-area { border: 2px dashed #ccc; padding: 20px; text-align: center; margin: 20px 0; }
        button { background: #775a19; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        .preview { max-width: 200px; margin: 20px auto; border: 1px solid #ddd; padding: 10px; border-radius: 8px; }
        .preview img { max-width: 100%; height: auto; }
        .bank-card { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; margin: 10px 0; display: flex; align-items: center; gap: 15px; }
        .bank-logo { width: 48px; height: 32px; background: white; border: 1px solid #ddd; border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .bank-logo img { width: 100%; height: 100%; object-fit: contain; }
        .bank-info { flex: 1; }
        .bank-name { font-size: 10px; font-weight: bold; color: #775a19; text-transform: uppercase; letter-spacing: 0.5px; }
        .bank-account { font-size: 14px; font-weight: 600; margin: 2px 0; }
        .bank-owner { font-size: 10px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏦 Test Upload Logo Bank</h1>
        
        <div class="upload-area">
            <h3>Upload Logo Bank</h3>
            <input type="file" id="bankLogoFile" accept="image/*">
            <br><br>
            <button onclick="uploadBankLogo()">Upload Logo Bank</button>
        </div>
        
        <div id="result"></div>
        
        <h2>Preview Tampilan Gift Section</h2>
        <div id="giftPreview">
            <!-- Default Preview -->
            <div class="bank-card">
                <div class="bank-logo">
                    <span style="font-size: 16px; color: #775a19;">🏦</span>
                </div>
                <div class="bank-info">
                    <div class="bank-name">BANK BRI</div>
                    <div class="bank-account">00550 11527 30502</div>
                    <div class="bank-owner">A/N Elvy Nur Fauziyah</div>
                </div>
                <button style="background: none; border: none; color: #775a19; cursor: pointer;">📋</button>
            </div>
        </div>
        
        <h2>Test API</h2>
        <button onclick="testGetSettings()">Test Get Settings</button>
        <div id="apiResult"></div>
        
        <h2>Contoh Logo Bank</h2>
        <p>Untuk testing, Anda bisa download logo bank dari:</p>
        <ul>
            <li><a href="https://logos-world.net/wp-content/uploads/2021/02/BRI-Logo.png" target="_blank">Logo BRI</a></li>
            <li><a href="https://logos-world.net/wp-content/uploads/2021/02/BCA-Logo.png" target="_blank">Logo BCA</a></li>
            <li><a href="https://logos-world.net/wp-content/uploads/2021/02/Mandiri-Logo.png" target="_blank">Logo Mandiri</a></li>
            <li><a href="https://logos-world.net/wp-content/uploads/2021/02/BNI-Logo.png" target="_blank">Logo BNI</a></li>
        </ul>
    </div>

    <script>
        function uploadBankLogo() {
            const fileInput = document.getElementById('bankLogoFile');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Pilih file logo bank terlebih dahulu!');
                return;
            }
            
            const formData = new FormData();
            formData.append('image', file);
            
            fetch('api/admin_api.php?action=upload_bank_logo&inv_id=1', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                const resultDiv = document.getElementById('result');
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div style="color: green; margin: 20px 0;">
                            <h3>✅ Upload Berhasil!</h3>
                            <p>Path: ${data.path}</p>
                            <div class="preview">
                                <img src="${data.path}" alt="Bank Logo">
                            </div>
                        </div>
                    `;
                    
                    // Update preview
                    updateGiftPreview(data.path);
                } else {
                    resultDiv.innerHTML = `
                        <div style="color: red; margin: 20px 0;">
                            <h3>❌ Upload Gagal!</h3>
                            <p>${data.message}</p>
                        </div>
                    `;
                }
            })
            .catch(error => {
                document.getElementById('result').innerHTML = `
                    <div style="color: red; margin: 20px 0;">
                        <h3>❌ Error!</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            });
        }
        
        function updateGiftPreview(logoPath) {
            document.getElementById('giftPreview').innerHTML = `
                <div class="bank-card">
                    <div class="bank-logo">
                        <img src="${logoPath}" alt="Bank Logo">
                    </div>
                    <div class="bank-info">
                        <div class="bank-name">BANK BRI</div>
                        <div class="bank-account">00550 11527 30502</div>
                        <div class="bank-owner">A/N Elvy Nur Fauziyah</div>
                    </div>
                    <button style="background: none; border: none; color: #775a19; cursor: pointer;">📋</button>
                </div>
            `;
        }
        
        function testGetSettings() {
            fetch('api/admin_api.php?action=get_settings&inv_id=1')
            .then(response => response.json())
            .then(data => {
                document.getElementById('apiResult').innerHTML = `
                    <h3>Settings API Response:</h3>
                    <pre style="background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto;">${JSON.stringify(data, null, 2)}</pre>
                `;
            });
        }
    </script>
</body>
</html>
